name: Prepare for release

# This action:
#   - Is triggered manually in a workflow dispatch;
#   - Inquire the kind of base and stage release in a dropdown menu;
#   - Use uv to bump up the versions;
#   - Create a new header for the new version at the changelogs;
#   - Check if all sub-projects share the same version number;
#   - Create a new branch named prepare-release/<new_version>;
#   - Open a draft PR to the main branch, so all the changes above can be reviewed by the team before merging.

on:
  workflow_dispatch:
    inputs:
      base_bump:
        description: Base version bump
        type: choice
        required: false
        options:
          - ""
          - major
          - minor
          - patch
          - stable
      stage_bump:
        description: Prerelease / release stage
        type: choice
        required: false
        options:
          - ""
          - alpha
          - beta
          - rc
          - post
          - dev


permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.compute-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7

      - name: Compute new version
        id: compute-version
        run: |
          BASE="${{ inputs.base_bump }}"
          STAGE="${{ inputs.stage_bump }}"
          CURRENT=$(uv version --short --directory lm-agent)
          NEW_VERSION=$(python3 scripts/bump_version.py "$CURRENT" "$BASE" "$STAGE")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW_VERSION"

      - name: Set version on all subprojects
        env:
          NEW_VERSION: ${{ steps.compute-version.outputs.version }}
        run: |
          for subproject in lm-agent lm-api lm-cli lm-simulator lm-simulator-api; do
            echo "Setting version $NEW_VERSION on $subproject"
            uv version "$NEW_VERSION" --no-sync --directory "$subproject"
          done

      - name: Verify version consistency
        env:
          EXPECTED: ${{ steps.compute-version.outputs.version }}
        run: |
          for subproject in lm-agent lm-api lm-cli lm-simulator lm-simulator-api; do
            CURRENT=$(uv version --short --directory "$subproject")
            if [ "$CURRENT" != "$EXPECTED" ]; then
              echo "Version mismatch in $subproject"
              echo "Expected: $EXPECTED"
              echo "Found:    $CURRENT"
              exit 1
            fi
            echo "$subproject: $CURRENT OK"
          done

  update-changelog:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install Towncrier and build changelog
        run: |
          pipx install towncrier==24.8.0
          make changelog-build

  create-pr:
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@4320041ed380b20e97d388d56a7fb4f9b8c20e79 # v7
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Prepared release ${{ needs.bump-version.outputs.version }}"
          branch: prepare-release/${{ needs.bump-version.outputs.version }}
          title: Release ${{ needs.bump-version.outputs.version }}
          draft: true
          delete-branch: true
          body: |
            Automated changes by [prepare_release](https://github.com/omnivector-solutions/license-manager/blob/main/.github/workflows/prepare_release.yaml) GitHub action.

      - name: Show Pull Request info
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
