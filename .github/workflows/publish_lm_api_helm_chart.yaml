name: Publish lm-api Helm Chart to GHCR

# This action:
#   - Is triggered when a chart-specific tag is pushed (lm-api-chart-v<Chart.yaml version>)
#     or manually via workflow_dispatch;
#   - Checks that helm/lm-api/Chart.yaml's version matches the tag;
#   - Packages the chart and pushes it as an OCI artifact to GHCR;
#   - Attaches the packaged chart to a GitHub Release.

on:
  push:
    tags:
      - "lm-api-chart-v*"
    paths:
      - "helm/lm-api/**"
      - ".github/workflows/publish_lm_api_helm_chart.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - id: chart-version
        name: Get chart version from Chart.yaml
        working-directory: helm/lm-api
        run: |
          echo "version=$(grep '^version:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Fail if chart version doesn't match the tag
        if: ${{ github.ref_type == 'tag' && github.ref_name != format('lm-api-chart-v{0}', steps.chart-version.outputs.version) }}
        run: |
          echo "Chart.yaml version doesn't match tag!"
          echo "tag=${{ github.ref_name }}, expected=lm-api-chart-v${{ steps.chart-version.outputs.version }}"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        working-directory: helm/lm-api
        run: helm package .

      - name: Publish Helm chart to GHCR
        working-directory: helm/lm-api
        run: |
          CHART_PACKAGE=$(ls *.tgz)
          helm push "$CHART_PACKAGE" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Attach chart package to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: helm/lm-api/*.tgz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
