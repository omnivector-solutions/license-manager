# Default values for lm-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/omnivector-solutions/lm-api
  tag: "5.0.0"
  pullPolicy: Always

# Names of existing Secrets to use as imagePullSecrets, e.g. if
# `image.repository` points at a private registry.
imagePullSecrets: []

replicaCount: 1

# Pod scheduling for the API deployment. Left empty by default so the chart
# makes no assumptions about your cluster's nodes/zones. Set these if you
# need to pin workloads (e.g. to a specific node pool or spot instances).
affinity: {}
tolerations: []
nodeSelector: {}

resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    cpu: 300m
    memory: 500Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 100
  targetMemoryUtilizationPercentage: 100

# Auth. lm-api validates JWTs (via armasec) against an OIDC realm you
# provide, e.g. Keycloak, Auth0, or any other OIDC-compliant provider.
auth:
  # Domain + realm path used to fetch signing keys, e.g.
  # "keycloak.example.com/realms/license-manager". Required.
  armasecDomain: ""

# Multi-tenancy. When enabled, lm-api selects the database from the
# organization id in the user's token. When disabled (default), lm-api uses
# the single database defined by `postgres.database`.
multiTenancy:
  enabled: false

# Database migrations run in an init container of the lm-api pod. The lm-api
# image does not ship alembic, so the init container installs it at startup
# (requires access to a PyPI index).
migration:
  alembicVersion: "1.17.2"

# Sentry error tracking. Disabled by default.
sentry:
  enabled: false
  dsn: ""
  tracesSampleRate: 0.0
  profilesSampleRate: 0.0

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /lm
  tls: []

service:
  annotations: {}

# Leave empty to use the cluster's default StorageClass.
storageClassName: ""

# lm-api's own Postgres database, managed via CloudNativePG
# (https://cloudnative-pg.io/). Requires the CloudNativePG operator to be
# installed in the cluster.
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:17-bookworm
  # Database created by Postgres. Also passed to lm-api as DATABASE_NAME
  # when multi-tenancy is disabled.
  database: lm
  # Owner of the database above, and the role lm-api connects as.
  # CloudNativePG generates its password and exposes both username and
  # password in the "lm-postgres-app" Secret.
  owner: lm
  storageSize: 10Gi
  # 2 instances (1 primary + 1 standby, pod anti-affinity enabled) when true,
  # otherwise a single instance.
  highAvailability: true
  resources:
    requests:
      memory: 50Mi
      cpu: 10m
    limits:
      memory: 500Mi
      cpu: 300m

  # Continuous backup to S3 (or an S3-compatible service) via CloudNativePG's
  # Barman Cloud integration. Disabled by default. This chart never creates
  # the bucket itself; you provide one plus credentials able to read/write it.
  backup:
    enabled: false
    # CloudNativePG's ScheduledBackup uses a 6-field cron format (with a
    # leading seconds specifier), unlike standard Kubernetes CronJobs.
    schedule: "0 0 0 * * *"
    retentionPolicy: "30d"
    # s3://<bucket>/<path>
    destinationPath: ""
    # Leave empty to use AWS S3's default endpoint. Set this to point at an
    # S3-compatible service instead (e.g. a self-hosted MinIO/Garage, outside
    # this chart, dedicated to backups).
    endpointUrl: ""
    # Static credentials. Ignored if existingSecret is set below.
    accessKeyId: ""
    secretAccessKey: ""
    # Only needed if your endpoint requires a specific region.
    region: ""
    # Name of an existing Secret to source credentials from instead of the
    # values above (e.g. one managed by External Secrets). Must contain the
    # keys named below; existingSecretRegionKey is only read when `region`
    # above is set.
    existingSecret: ""
    existingSecretAccessKeyIdKey: ACCESS_KEY_ID
    existingSecretSecretAccessKeyKey: ACCESS_SECRET_KEY
    existingSecretRegionKey: REGION

# Image used by the init container that waits for Postgres to be reachable.
pgCheckerImage: busybox:latest
