{{- if .Values.deployHpa -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lm-api
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    k8s-app: lm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lm-api
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 100
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 100
{{- end }}
