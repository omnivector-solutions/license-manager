apiVersion: v1
kind: ConfigMap
metadata:
  name: lm-check-migration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    k8s-app: lm
data:
  check-migration.py: |
    import os
    import subprocess
    import sys

    from sqlalchemy import create_engine, text
    from sqlalchemy.engine import URL

    TENANT_DB_REGEX = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"


    def server_url(database):
        return URL.create(
            "postgresql+psycopg2",
            username=os.environ["DATABASE_USER"],
            password=os.environ["DATABASE_PSWD"],
            host=os.environ["DATABASE_HOST"],
            port=int(os.environ["DATABASE_PORT"]),
            database=database,
        )


    def list_databases():
        if os.environ.get("MULTI_TENANCY_ENABLED", "false").lower() != "true":
            return [os.environ["DATABASE_NAME"]]

        # Multi-tenancy: one database per organization, named after the organization id (UUID).
        engine = create_engine(server_url("postgres"))
        with engine.connect() as conn:
            rows = conn.execute(text("SELECT datname FROM pg_database WHERE datname ~ :regex"), {"regex": TENANT_DB_REGEX})
            return [row[0] for row in rows]


    try:
        databases = list_databases()
    except Exception as err:
        print(f"Fail when trying to connect to database: {err}")
        sys.exit(1)

    print(f"Databases to migrate: {databases}")

    failed = []
    for db in databases:
        print(f"Running migrations on DB {db}")
        # lm_api settings are loaded once per process, so run alembic in a
        # separate process for each database. The alembic console script does
        # not add the working directory to sys.path, which env.py needs to
        # import lm_api.
        result = subprocess.run(
            ["alembic", "--config=alembic/alembic.ini", "upgrade", "head"],
            env={**os.environ, "DATABASE_NAME": db, "PYTHONPATH": os.getcwd()},
        )
        if result.returncode != 0:
            failed.append(db)

    if failed:
        print(f"Migration failed on: {failed}")
        sys.exit(1)

    print("All databases are up to date")
