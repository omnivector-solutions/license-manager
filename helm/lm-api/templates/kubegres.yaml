apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lm-postgres-backup-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s-app: lm
spec:
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: lm-postgres-primary-password
  labels:
    k8s-app: lm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 42
  digits: 10
  symbols: 10
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: lm-postgres-replica-password
  labels:
    k8s-app: lm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 42
  digits: 10
  symbols: 10
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lm-kubegres-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    k8s-app: lm
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: lm-kubegres-credentials
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "lm-postgres-primary-password"
      rewrite:
        - regexp:
            source: "(.*)"
            target: "primary-password"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "lm-postgres-replica-password"
      rewrite:
        - regexp:
            source: "(.*)"
            target: "replica-password"
---
apiVersion: kubegres.reactive-tech.io/v1
kind: Kubegres
metadata:
  name: lm-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s-app: lm
spec:
  replicas: {{ .Values.postgres.replicas }}
  image: postgres:14.1
  database:
    size: {{ .Values.postgres.storageSize }}
    {{- with .Values.storageClassName }}
    storageClassName: {{ . }}
    {{- end }}
    volumeMount: /var/lib/postgresql/data
  backup:
    schedule: "{{ .Values.postgres.backupSchedule }}"
    pvcName: lm-postgres-backup-pvc
    volumeMount: /var/lib/backup
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  scheduler:
    {{- if .Values.affinity }}
    affinity:
      {{- toYaml .Values.affinity | nindent 6 }}
    {{- else if .Values.postgres.highAvailability }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: lm-postgres
          - weight: 90
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: lm-postgres
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: lm-kubegres-credentials
          key: primary-password
    - name: POSTGRES_REPLICATION_PASSWORD
      valueFrom:
        secretKeyRef:
          name: lm-kubegres-credentials
          key: replica-password
    - name: POSTGRES_USER
      value: omnivector
    - name: POSTGRES_DB
      value: lm
