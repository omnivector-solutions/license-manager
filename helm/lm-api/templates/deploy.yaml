apiVersion: apps/v1
kind: Deployment
metadata:
  name: lm-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s-app: lm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lm-api
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lm-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "default/python-instrumentation"
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: check-migration
          configMap:
            name: lm-check-migration
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: pgchecker
          command:
            - sh
            - -c
            - |-
              echo ">>>>> Waiting for Postgres to be ready"
              until nc -z -w 2 $HOST 5432; do sleep 2; done;
              echo "<<<<< Postgres ready"
          image: {{ .Values.pgCheckerImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: HOST
              value: lm-postgres
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |-
              pip --python /app/.venv/bin/python install --no-cache-dir --quiet "alembic=={{ .Values.migration.alembicVersion }}" \
                && cd /app && python check-migration.py
          envFrom:
            - configMapRef:
                name: lm-api
          env:
            {{- include "lm-api.dbEnv" . | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: check-migration
              mountPath: /app/check-migration.py
              subPath: check-migration.py
      containers:
        - name: lm-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lm-api
          env:
            {{- include "lm-api.dbEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
      restartPolicy: Always
